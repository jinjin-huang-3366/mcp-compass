server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: mcp-compass
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mcp_compass}?sslmode=${PGSSLMODE:prefer}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:mcp_compass}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:mcp_compass}}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cors:
    allowed-origin-patterns: ${MCP_COMPASS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
  generation:
    openapi-source:
      max-bytes: 2097152
      connect-timeout: 5s
      read-timeout: 20s
  github:
    enrichment:
      enabled: ${MCP_COMPASS_GITHUB_ENRICHMENT_ENABLED:false}
      base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      connect-timeout: 5s
      read-timeout: 15s
      max-artifact-bytes: 262144
      max-static-tools: 100
      max-tool-schema-bytes: 65536
      static-metadata-paths:
        - .mcp/server.json
        - mcp-server.json
  search:
    vector:
      enabled: ${MCP_COMPASS_VECTOR_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      connect-timeout: 5s
      read-timeout: 30s
      candidate-limit: 100
      min-similarity: 0.35
  requirement:
    llm:
      enabled: ${MCP_COMPASS_LLM_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      connect-timeout: 5s
      read-timeout: 30s
      max-output-tokens: 800
  registry:
    base-url: https://registry.modelcontextprotocol.io
    page-size: 100
    connect-timeout: 5s
    read-timeout: 20s
    sync:
      enabled: false
      fixed-delay-ms: 3600000
      max-pages-per-run: 5
    cron:
      enabled: ${MCP_COMPASS_REGISTRY_CRON_ENABLED:false}
      secret: ${CRON_SECRET:}
      max-pages-per-run: ${MCP_COMPASS_REGISTRY_CRON_MAX_PAGES:5}
  production-relevance:
    maintenance:
      enabled: ${MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_ENABLED:false}
      secret: ${MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_SECRET:}
