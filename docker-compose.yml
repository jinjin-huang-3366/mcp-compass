services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_compass}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_compass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_compass} -d ${POSTGRES_DB:-mcp_compass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mcp_compass_pg:/var/lib/postgresql

volumes:
  mcp_compass_pg:
