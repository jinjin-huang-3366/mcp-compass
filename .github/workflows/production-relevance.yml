name: MCP Compass production relevance activation

on:
  workflow_call:
    inputs:
      task_sha:
        required: true
        type: string
      max_registry_pages:
        required: true
        type: string
      embedding_batch_size:
        required: true
        type: string
      confirm_production:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      task_sha:
        description: Full DEP-04 task branch commit to run
        required: true
        type: string
      max_registry_pages:
        description: Maximum full Registry pages to ingest
        required: true
        default: '5'
        type: string
      embedding_batch_size:
        description: Maximum documents per embedding request
        required: true
        default: '100'
        type: string
      confirm_production:
        description: Confirm production configuration and data maintenance
        required: true
        default: false
        type: boolean

concurrency:
  group: mcp-compass-production-relevance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activate:
    name: Activate, resync, backfill, and smoke-test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out DEP-04 task commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.task_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded production request
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          EMBEDDING_BATCH_SIZE: ${{ inputs.embedding_batch_size }}
          MAX_REGISTRY_PAGES: ${{ inputs.max_registry_pages }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_SHA: ${{ inputs.task_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PRODUCTION" == "true" ]] || { echo "Production activation was not confirmed." >&2; exit 1; }
          [[ "$TASK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "task_sha must be a full commit SHA." >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$TASK_SHA" ]] || { echo "Checked-out commit does not match task_sha." >&2; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor origin/main HEAD || { echo "DEP-04 does not contain current main." >&2; exit 1; }
          [[ "$MAX_REGISTRY_PAGES" =~ ^[0-9]+$ ]] && (( MAX_REGISTRY_PAGES >= 1 && MAX_REGISTRY_PAGES <= 20 )) || {
            echo "max_registry_pages must be between 1 and 20." >&2; exit 1;
          }
          [[ "$EMBEDDING_BATCH_SIZE" =~ ^[0-9]+$ ]] && (( EMBEDDING_BATCH_SIZE >= 1 && EMBEDDING_BATCH_SIZE <= 200 )) || {
            echo "embedding_batch_size must be between 1 and 200." >&2; exit 1;
          }
          [[ -n "$OPENAI_API_KEY" ]] || { echo "Missing OPENAI_API_KEY." >&2; exit 1; }
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]] || {
            echo "Missing required Vercel credential." >&2; exit 1;
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.10.0

      - name: Enable production relevance settings and redeploy
        id: deployment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          vercel env add MCP_COMPASS_LLM_ENABLED production --value true --no-sensitive --force --yes --token="$VERCEL_TOKEN"
          vercel env add MCP_COMPASS_VECTOR_ENABLED production --value true --no-sensitive --force --yes --token="$VERCEL_TOKEN"
          vercel env add MCP_COMPASS_GITHUB_ENRICHMENT_ENABLED production --value true --no-sensitive --force --yes --token="$VERCEL_TOKEN"
          printf '%s' "$OPENAI_API_KEY" | vercel env add OPENAI_API_KEY production --sensitive --force --yes --token="$VERCEL_TOKEN"

          vercel list --environment production --status READY --limit 10 --json --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/deployments.json"
          current_url="$(python - "$RUNNER_TEMP/deployments.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          deployments = payload if isinstance(payload, list) else payload.get("deployments", [])
          for deployment in deployments:
              url = deployment.get("url")
              if url:
                  print(url if url.startswith("https://") else "https://" + url)
                  break
          else:
              raise SystemExit("No ready production deployment found")
          PY
          )"
          redeployed_url="$(vercel redeploy "$current_url" --target production --token="$VERCEL_TOKEN")"
          [[ "$redeployed_url" == https://*.vercel.app ]] || { echo "Vercel did not return a deployment URL." >&2; exit 1; }
          echo "url=$redeployed_url" >> "$GITHUB_OUTPUT"

      - name: Verify activated production backend
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 18); do
            if vercel curl /actuator/health --deployment "$DEPLOYMENT_URL" -- \
              --fail --silent --show-error --output "$RUNNER_TEMP/health.json"; then
              healthy=true
              break
            fi
            sleep 10
          done
          [[ "$healthy" == "true" ]] || { echo "Activated backend did not become healthy." >&2; exit 1; }
          python - "$RUNNER_TEMP/health.json" <<'PY'
          import json
          import pathlib
          import sys
          assert json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("status") == "UP"
          PY

      - name: Run bounded resync and backfill
        id: maintenance
        env:
          EMBEDDING_BATCH_SIZE: ${{ inputs.embedding_batch_size }}
          GITHUB_TOKEN: ${{ github.token }}
          MAX_REGISTRY_PAGES: ${{ inputs.max_registry_pages }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          maintenance_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$maintenance_secret"
          cleanup() {
            vercel env remove MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_SECRET production \
              --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            vercel env remove MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_ENABLED production \
              --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          vercel env add MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_ENABLED production \
            --value true --no-sensitive --force --yes --token="$VERCEL_TOKEN"
          printf '%s' "$maintenance_secret" | vercel env add \
            MCP_COMPASS_PRODUCTION_RELEVANCE_MAINTENANCE_SECRET production \
            --sensitive --force --yes --token="$VERCEL_TOKEN"

          maintenance_url="$(vercel deploy \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --meta githubCommitSha="${{ inputs.task_sha }}" \
            --meta githubCommitRef=task/dep-04 \
            --token="$VERCEL_TOKEN")"
          [[ "$maintenance_url" == https://*.vercel.app ]] || {
            echo "Vercel did not return a staged maintenance deployment URL." >&2
            exit 1
          }

          vercel curl "/api/v1/internal/production-relevance/activate?maxPages=$MAX_REGISTRY_PAGES&embeddingBatchSize=$EMBEDDING_BATCH_SIZE" \
            --deployment "$maintenance_url" -- \
            --fail --silent --show-error --max-time 3000 \
            --header "Authorization: Bearer $maintenance_secret" \
            --request POST \
            --output "$RUNNER_TEMP/activation.json"
          python - "$RUNNER_TEMP/activation.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          coverage = payload["coverage"]
          corpus = coverage["corpusServers"]
          if coverage["serversWithSearchDocuments"] != corpus:
              raise SystemExit("Search-document coverage is incomplete")
          if coverage["serversWithEmbeddings"] != corpus:
              raise SystemExit("Embedding coverage is incomplete")
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for key in ("registryPages", "registryServers", "backfilledDocuments"):
                  output.write(f"{key}={payload[key]}\n")
              output.write(f"registryHasMore={str(payload['registryHasMore']).lower()}\n")
              for key, value in coverage.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Smoke test production hybrid search
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"requirement":"Find a GitHub MCP server that can create pull requests but must not delete repositories","pageSize":3}' > "$RUNNER_TEMP/search-request.json"
          vercel curl /api/v1/mcp/search --deployment "$DEPLOYMENT_URL" -- \
            --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --request POST \
            --data-binary "@$RUNNER_TEMP/search-request.json" \
            --output "$RUNNER_TEMP/search-response.json"
          python - "$RUNNER_TEMP/search-response.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          parsed = payload.get("parsedIntent") or {}
          if "github.repository.delete" not in parsed.get("forbiddenCapabilities", []):
              raise SystemExit("Production search did not preserve the forbidden delete capability")
          if not isinstance(payload.get("matches"), list):
              raise SystemExit("Production search response did not contain matches")
          print(json.dumps({
              "strongMatch": payload.get("strongMatch"),
              "totalMatches": payload.get("totalMatches"),
              "forbiddenCapabilities": parsed.get("forbiddenCapabilities"),
          }, sort_keys=True))
          PY

      - name: Publish redacted activation summary
        env:
          BACKFILLED_DOCUMENTS: ${{ steps.maintenance.outputs.backfilledDocuments }}
          CORPUS_SERVERS: ${{ steps.maintenance.outputs.corpusServers }}
          EMBEDDING_SERVERS: ${{ steps.maintenance.outputs.serversWithEmbeddings }}
          GITHUB_ARTIFACT_SERVERS: ${{ steps.maintenance.outputs.serversWithGithubArtifacts }}
          GITHUB_METRIC_SERVERS: ${{ steps.maintenance.outputs.serversWithGithubMetrics }}
          NORMALIZED_CAPABILITIES: ${{ steps.maintenance.outputs.normalizedCapabilities }}
          REGISTRY_HAS_MORE: ${{ steps.maintenance.outputs.registryHasMore }}
          REGISTRY_PAGES: ${{ steps.maintenance.outputs.registryPages }}
          SEARCH_DOCUMENT_SERVERS: ${{ steps.maintenance.outputs.serversWithSearchDocuments }}
          SERVERS_WITH_CAPABILITIES: ${{ steps.maintenance.outputs.serversWithCapabilities }}
          TASK_SHA: ${{ inputs.task_sha }}
        shell: bash
        run: |
          {
            printf '## Production relevance activation\n\n'
            printf -- '- Task commit: `%s`\n' "$TASK_SHA"
            printf -- '- Features: LLM analysis, vectors, and GitHub enrichment enabled\n'
            printf -- '- Registry bounded-resync pages: %s\n' "$REGISTRY_PAGES"
            printf -- '- Registry continuation remains: %s\n' "$REGISTRY_HAS_MORE"
            printf -- '- Corpus servers: %s\n' "$CORPUS_SERVERS"
            printf -- '- Capability coverage: %s servers / %s normalized capabilities\n' "$SERVERS_WITH_CAPABILITIES" "$NORMALIZED_CAPABILITIES"
            printf -- '- Search-document coverage: %s/%s\n' "$SEARCH_DOCUMENT_SERVERS" "$CORPUS_SERVERS"
            printf -- '- Embedding coverage: %s/%s\n' "$EMBEDDING_SERVERS" "$CORPUS_SERVERS"
            printf -- '- GitHub coverage: %s metrics, %s content artifacts\n' "$GITHUB_METRIC_SERVERS" "$GITHUB_ARTIFACT_SERVERS"
            printf -- '- Backfilled documents: %s\n' "$BACKFILLED_DOCUMENTS"
            printf -- '- Health and hybrid-search smoke tests: passed\n'
            printf -- '- Credential values: redacted and never written to the summary\n'
          } >> "$GITHUB_STEP_SUMMARY"
