name: Codex task pull request

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task implemented locally with Codex
        required: true
        type: string
      branch_name:
        description: Existing pushed task branch, for example task/registry-metrics
        required: true
        type: string
      base_branch:
        description: Branch the pull request targets
        required: true
        default: main
        type: string
      pr_title:
        description: Pull request title
        required: true
        type: string
      summary:
        description: Summary of the changes produced by local Codex
        required: true
        type: string
      desk_testing:
        description: Reproducible manual test steps, expected results, and any steps not run
        required: true
        type: string
      plan_item:
        description: Exact unchecked PLANS.md item to complete after merge, or blank
        required: false
        default: ''
        type: string

concurrency:
  group: codex-single-task-flow
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and open pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out task branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required credentials
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          [[ -n "$GMAIL_ADDRESS" ]] || { echo "Missing GMAIL_ADDRESS secret." >&2; exit 1; }
          [[ -n "$GMAIL_APP_PASSWORD" ]] || { echo "Missing GMAIL_APP_PASSWORD secret." >&2; exit 1; }

      - name: Validate task branch
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        shell: bash
        run: |
          git check-ref-format --branch "$BASE_BRANCH"
          git check-ref-format --branch "$BRANCH_NAME"
          if [[ "$BRANCH_NAME" == "$BASE_BRANCH" ]]; then
            echo "Task branch must differ from the base branch." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" \
            "+refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH_NAME")" ]]; then
            echo "Checked-out commit does not match the pushed task branch." >&2
            exit 1
          fi

          git diff --check "origin/$BASE_BRANCH...HEAD"
          if git diff --quiet "origin/$BASE_BRANCH...HEAD"; then
            echo "Task branch has no changes relative to $BASE_BRANCH." >&2
            exit 1
          fi

      - name: Prepare local Codex artifacts
        env:
          CODEX_SUMMARY: ${{ inputs.summary }}
          DESK_TESTING_PATH: ${{ runner.temp }}/desk-testing.md
          TASK_DESK_TESTING: ${{ inputs.desk_testing }}
        shell: bash
        run: |
          printf '%s\n' "$CODEX_SUMMARY" > "$RUNNER_TEMP/codex-summary.md"
          python .github/scripts/prepare_desk_testing.py

      - name: Validate plan item
        if: ${{ inputs.plan_item != '' }}
        env:
          PLAN_ITEM: ${{ inputs.plan_item }}
        run: python .github/scripts/mark_plan_item_complete.py --check-item "$PLAN_ITEM"

      - name: Test workflow automation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw -pl backend test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web application
        working-directory: web
        run: npm run lint

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Open pull request
        id: pull_request
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          CODEX_SUMMARY: ${{ runner.temp }}/codex-summary.md
          DESK_TESTING: ${{ runner.temp }}/desk-testing.md
          GH_TOKEN: ${{ github.token }}
          PLAN_ITEM: ${{ inputs.plan_item }}
          PR_TITLE: ${{ inputs.pr_title }}
          TASK_DESCRIPTION: ${{ inputs.task }}
        shell: bash
        run: |
          {
            printf '## Task\n\n%s\n\n' "$TASK_DESCRIPTION"
            printf '## Local Codex summary\n\n'
            cat "$CODEX_SUMMARY"
            printf '\n\n## Desk testing\n\n'
            cat "$DESK_TESTING"
            printf '\n\n## Validation\n\n'
            printf '%s\n' '- `./mvnw -pl backend test`'
            printf '%s\n' '- `cd web && npm ci && npm run lint && npm run build`'
            printf '%s\n' '- `python -m unittest discover -s .github/scripts -p '"'"'test_*.py'"'"'`'
            if [[ -n "$PLAN_ITEM" ]]; then
              printf '\n## Plan tracking\n\nMark `%s` complete after merge.\n' "$PLAN_ITEM"
              printf '\n<!-- mcp-compass-plan-item: %s -->\n' "$PLAN_ITEM"
            fi
            printf '\nThis pull request was created automatically but must be merged manually.\n'
          } > "$RUNNER_TEMP/pr-body.md"

          pr_url=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          printf 'Created pull request: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Start baseline CI
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BRANCH_NAME"

      - name: Email pull request summary
        if: ${{ always() && steps.pull_request.outcome == 'success' }}
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          CODEX_SUMMARY_PATH: ${{ runner.temp }}/codex-summary.md
          DESK_TESTING_PATH: ${{ runner.temp }}/desk-testing.md
          EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.GMAIL_ADDRESS }}
          TASK_DESCRIPTION: ${{ inputs.task }}
        run: python .github/scripts/send_pr_email.py
